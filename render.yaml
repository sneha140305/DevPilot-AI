services:
  - type: web
    name: devpilot-ai-api
    runtime: python
    plan: free

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: APP_ENV
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: ENABLE_AI_REVIEW
        value: "false"